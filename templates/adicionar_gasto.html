{% extends "base.html" %}

{% block title %}Adicionar Gasto{% endblock %}

{% block content %}
<div class="card animated" style="max-width: 600px; margin: 20px auto;">
    <div class="card-body">
        <h2 class="card-title"><i class="fas fa-plus-circle"></i> Adicionar Gasto</h2>
        <form method="POST" action="{{ url_for('adicionar_gasto') }}">
            <div class="form-group">
                <label for="valor" class="form-label">Valor</label>
                <input type="number" step="0.01" class="form-control" id="valor" name="valor" required>
            </div>
            <div class="form-group">
                <label for="categoria" class="form-label">Categoria</label>
                <select class="form-control" id="categoria" name="categoria" required>
                    {% for categoria in categorias %}
                    <option value="{{ categoria }}">{{ categoria }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Tipo de Gasto</label>
                <div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo" id="necessario" value="necessario" checked>
                        <label class="form-check-label" for="necessario">Necessário</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipo" id="desnecessario" value="desnecessario">
                        <label class="form-check-label" for="desnecessario">Desnecessário</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="descricao" class="form-label">Descrição (Opcional)</label>
                <textarea class="form-control" id="descricao" name="descricao" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-save"></i> Salvar Gasto
            </button>
        </form>
    </div>
</div>
{% endblock %}
