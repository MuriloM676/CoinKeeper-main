{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<div class="card animated" style="max-width: 500px; margin: 50px auto;">
    <div class="card-body">
        <h2 class="card-title"><i class="fas fa-user-plus"></i> Cadastro</h2>
        <form method="POST" action="{{ url_for('cadastro') }}">
            <div class="form-group">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <div class="form-group">
                <label for="salario" class="form-label">Salário Mensal</label>
                <input type="number" step="0.01" class="form-control" id="salario" name="salario" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-check"></i> Cadastrar
            </button>
        </form>
        <div class="mt-3 text-center">
            <p>Já tem uma conta? <a href="{{ url_for('login') }}" style="color: var(--primary-light);">Faça login</a></p>
        </div>
    </div>
</div>
{% endblock %}
